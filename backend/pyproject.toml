[project]
name = "fai-benchmark-backend"
version = "0.1.0"
description = "Backend API for the FAI benchmark app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "inspect-ai==0.3.224",
    "adlfs==2026.5.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "azure-monitor-opentelemetry>=1.6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
fai-benchmark-backend = "app.main:create_app"
